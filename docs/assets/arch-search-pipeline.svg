<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" width="760" height="260">
  <defs>
    <style>
      text { font-family: 'SF Mono', 'JetBrains Mono', monospace; fill: #dfe1e8; }
      .label { font-size: 11px; }
      .sublabel { font-size: 9.5px; fill: #7a7f94; }
      .arrow { stroke: #7a7f94; stroke-width: 1.5; fill: none; marker-end: url(#sa); }
    </style>
    <marker id="sa" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7a7f94"/>
    </marker>
  </defs>
  <rect width="760" height="260" fill="#0b0d11"/>
  <text x="380" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#dfe1e8">Hybrid Search Pipeline</text>

  <!-- Query -->
  <rect x="300" y="42" width="160" height="38" rx="6" fill="#14171f" stroke="#1f2330" stroke-width="1.5"/>
  <text x="380" y="60" text-anchor="middle" class="label">ctx_hybrid(doc, query, k)</text>
  <text x="380" y="74" text-anchor="middle" class="sublabel">called from Rhai script</text>

  <!-- Split -->
  <line x1="310" y1="80" x2="200" y2="118" class="arrow"/>
  <line x1="450" y1="80" x2="560" y2="118" class="arrow"/>

  <!-- BM25 branch -->
  <rect x="90" y="120" width="210" height="44" rx="6" fill="#14171f" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="195" y="140" text-anchor="middle" class="label" fill="#f59e0b">BM25 Search</text>
  <text x="195" y="156" text-anchor="middle" class="sublabel">tokenize · TF-IDF score · rank</text>

  <!-- Semantic branch -->
  <rect x="455" y="120" width="210" height="44" rx="6" fill="#14171f" stroke="#34d399" stroke-width="1.5"/>
  <text x="560" y="140" text-anchor="middle" class="label" fill="#34d399">Semantic Search</text>
  <text x="560" y="156" text-anchor="middle" class="sublabel">embed query → HNSW cosine ANN</text>

  <!-- Both → RRF -->
  <line x1="195" y1="164" x2="310" y2="198" class="arrow"/>
  <line x1="560" y1="164" x2="450" y2="198" class="arrow"/>

  <!-- RRF -->
  <rect x="270" y="200" width="220" height="44" rx="6" fill="#14171f" stroke="#5b8def" stroke-width="1.5"/>
  <text x="380" y="220" text-anchor="middle" class="label" font-weight="600" fill="#5b8def">Reciprocal Rank Fusion</text>
  <text x="380" y="236" text-anchor="middle" class="sublabel">score(d) = Σ 1/(60 + rank_r(d)) · top-k</text>

  <!-- Result label -->
  <text x="380" y="258" text-anchor="middle" class="sublabel">→ joined chunk texts returned as String to Rhai</text>
</svg>
